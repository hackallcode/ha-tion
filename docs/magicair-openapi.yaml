      parameters:
      - &id002
        name: zoneGuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
    delete:
      tags:
      - Zone
      summary: Delete zone
      operationId: DeleteZone
      x-evidence: apk-static
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      description: Destructive; static declaration only.
      parameters:
      - *id002
  /zone/{zoneGuid}/data/{period}:
    get:
      tags:
      - Zone
      summary: Get zone history by period
      operationId: GetZoneHistoryByPeriod
      x-evidence: observed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FreeForm'
      x-ui-action: Графики за 12 часов / 3 дня
      parameters:
      - *id002
      - name: period
        in: path
        required: true
        schema:
          type: string
          enum:
          - 12hours
          - 3days
  /zone/{zoneGuid}/data/{start}/{stop}:
    get:
      tags:
      - Zone
      summary: Get zone history by range
      operationId: GetZoneHistoryByRange
      x-evidence: apk-static
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FreeForm'
      parameters:
      - *id002
      - name: start
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: stop
        in: path
        required: true
        schema:
          type: integer
          format: int64
  /zone/{zoneGuid}/mode:
    post:
      tags:
      - Zone
      summary: Set zone mode and targets
      operationId: SetZoneModeAndTargets
      x-evidence: observed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      x-ui-action: Авто/ручной режим и целевой CO₂
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneModeRequest'
            example:
              mode: auto
              co2: 1200
              temperature: 0
              humidity: 0
              noise: 0
              pm25: 0
              pm10: 0
  /zone/{zoneGuid}/schedule:
    post:
      tags:
      - Schedule control
      summary: Enable or disable schedule
      operationId: EnableOrDisableSchedule
      x-evidence: observed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      x-ui-action: Галочка «работа по расписанию»
      description: 'Mobile-only signature missing from the web client. Task type: toggleCalendar.'
      parameters:
      - *id002
      - name: 'on'
        in: query
        required: true
        schema:
          type: boolean
        description: true enables, false disables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
            example: {}
  /zone/{zoneGuid}/schedule/preset:
    post:
      tags:
      - Schedule control
      summary: Restore current schedule preset
      operationId: RestoreCurrentSchedulePreset
      x-evidence: observed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      x-ui-action: «Восстановить/применить настройки расписания»
      description: 'Observed without query string. APK declaration contains optional presetId, but the live app
        omitted it. Task type: activatePreset.'
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
            example: {}
  /preset/{zoneGuid}:
    get:
      tags:
      - Presets
      summary: List presets
      operationId: ListPresets
      x-evidence: observed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preset'
      x-ui-action: Открытие пресетов/расписания
      parameters:
      - *id002
    post:
      tags:
      - Presets
      summary: Create preset
      operationId: CreatePreset
      x-evidence: observed
      responses:
        '200':
          description: Success, empty body
      x-ui-action: Создание пресета
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preset'
    put:
      tags:
      - Presets
      summary: Update preset
      operationId: UpdatePreset
      x-evidence: observed
      responses:
        '200':
          description: Success, empty body
      x-ui-action: Редактирование пресета
      parameters:
      - *id002
      - name: presetId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preset'
    delete:
      tags:
      - Presets
      summary: Delete preset
      operationId: DeletePreset
      x-evidence: observed
      responses:
        '200':
          description: Success, empty body
      x-ui-action: Удаление пресета
      description: Destructive. Observed only in Test zone.
      parameters:
      - *id002
      - name: presetId
        in: query
        required: true
        schema:
          type: string
          format: uuid
  /schedule/{zoneGuid}:
    get:
