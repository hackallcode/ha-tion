openapi: 3.0.3
info:
  title: Tion MagicAir mobile API (reverse engineered)
  version: 1.19.8-capture-2026-09-20
  description: Unofficial specification derived from MagicAir Android 1.19.8 traffic and APK Retrofit interfaces.
    Operations marked x-evidence=observed were captured live; apk-static operations were only declared in the APK
    and may be unavailable or unsafe.
servers:
- url: https://api.magicair.tion.ru
  description: Observed mobile backend
security:
- bearerAuth: []
tags:
- name: Auth
- name: Account
- name: Location
- name: Zone
- name: Schedule control
- name: Presets
- name: Schedules
- name: Device
- name: Tasks
- name: Events
- name: System
paths:
  /idsrv/oauth2/token:
    post:
      tags:
      - Auth
      summary: Password grant login
      operationId: login
      x-evidence: apk-static
      x-ui-action: Вход в аккаунт
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordGrant'
      responses:
        '200':
          description: OAuth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthToken'
  /idsrv/connect/token:
    post:
      tags:
      - Auth
      summary: Refresh access token
      operationId: refreshToken
      x-evidence: apk-static
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshGrant'
      responses:
        '200':
          description: OAuth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthToken'
  /account/info:
    get:
      tags:
      - Account
      summary: Get account info
      operationId: GetAccountInfo
      x-evidence: observed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeForm'
      x-ui-action: Загрузка профиля
    put:
      tags:
      - Account
      summary: Update account info
      operationId: UpdateAccountInfo
      x-evidence: apk-static
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeForm'
      x-ui-action: Изменение профиля/уведомлений
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
  /account/countries:
    get:
      tags:
      - Account
      summary: List countries
      operationId: ListCountries
      x-evidence: apk-static
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeForm'
      security: []
  /account/accept_documents:
    post:
      tags:
      - Account
      summary: Accept documents
      operationId: AcceptDocuments
      x-evidence: apk-static
      responses:
        '200':
          description: Success, empty body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
  /account/change_password:
    post:
      tags:
      - Account
      summary: Change password
