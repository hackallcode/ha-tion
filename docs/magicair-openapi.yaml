components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization: <token_type> <access_token>; observed token_type is Bearer.'
  schemas:
    FreeForm:
      type: object
      additionalProperties: true
    EmptyObject:
      type: object
      additionalProperties: false
    PasswordGrant:
      type: object
      required:
      - grant_type
      - username
      - password
      - client_id
      - client_secret
      properties:
        grant_type:
          type: string
          enum:
          - password
        username:
          type: string
        password:
          type: string
          format: password
        client_id:
          type: string
          format: uuid
        client_secret:
          type: string
          format: password
    RefreshGrant:
      type: object
      required:
      - grant_type
      - refresh_token
      - client_id
      - client_secret
      properties:
        grant_type:
          type: string
          enum:
          - refresh_token
        refresh_token:
          type: string
        client_id:
          type: string
          format: uuid
        client_secret:
          type: string
          format: password
    OAuthToken:
      type: object
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          example: <redacted>
        refresh_token:
          type: string
          example: <redacted>
        expires_in:
          type: integer
    Task:
      type: object
      required:
      - task_id
      - status
      - type
      - target_guid
      properties:
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - delivered
          - completed
          - failed
        type:
          type: string
          example: toggleCalendar
        target_guid:
          type: string
          format: uuid
        user_guid:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: <redacted>
    ZoneModeRequest:
      type: object
      required:
      - mode
      - co2
      properties:
        mode:
          type: string
          enum:
          - auto
          - manual
        co2:
          type: number
        temperature:
          type: number
        humidity:
          type: number
        noise:
          type: number
        pm25:
          type: number
        pm10:
          type: number
    DeviceModeRequest:
      type: object
      properties:
        is_on:
          type: boolean
        heater_enabled:
          type: boolean
        gate:
          type: integer
        heater_mode:
          type: string
          enum:
          - maintenance
          - heat
        speed:
          type: number
        speed_max_set:
          type: number
        speed_min_set:
          type: number
        sound:
          type: integer
        t_set:
          type: number
    DeviceSettingsRequest:
      type: object
      description: Union payload; observed {backlight:0}. APK also declares sound, turbo and filter-reset variants.
      additionalProperties: true
      properties:
        backlight:
          type: integer
        sound:
          type: integer
    Preset:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: integer
        incomplete_device_list:
          type: boolean
          nullable: true
        climate_settings:
          $ref: '#/components/schemas/ZoneModeRequest'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/FreeForm'
        notUpdating:
          type: boolean
    ScheduleTiming:
      type: object
      required:
      - preset_id
      - starts_at
      properties:
        preset_id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: integer
        starts_at:
          type: integer
          minimum: 0
          maximum: 86399
          description: Seconds from local midnight
    Schedule:
      type: object
      required:
      - active_days
      - timings
      properties:
        guid:
          type: string
          format: uuid
        active_days:
          type: array
          items:
            type: string
            enum:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
        timings:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleTiming'
        creationTimeIso:
          oneOf:
          - type: integer
          - type: string
        updateTimeIso:
          oneOf:
          - type: integer
          - type: string
    ScheduleState:
      type: object
      properties:
        is_schedule_sync:
          type: boolean
        is_active:
          type: boolean
        is_mode_sync:
          type: boolean
        current_preset:
          $ref: '#/components/schemas/FreeForm'
        next_preset_starts_at:
          type: integer
        next_starts_iso:
          type: string
    Zone:
      type: object
      required:
      - guid
      - name
      properties:
        guid:
          type: string
          format: uuid
        name:
          type: string
        mode:
          $ref: '#/components/schemas/FreeForm'
        schedule:
          $ref: '#/components/schemas/ScheduleState'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/FreeForm'
        sensors_average:
          type: array
          items:
            $ref: '#/components/schemas/FreeForm'
    Location:
      type: object
      required:
      - guid
      - name
      - zones
      properties:
        guid:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: integer
        connection:
          $ref: '#/components/schemas/FreeForm'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
    Locations:
      type: array
      items:
        $ref: '#/components/schemas/Location'
    DeviceOrder:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
      description: zoneGuid -> deviceGuid -> zero-based order
