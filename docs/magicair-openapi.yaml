      operationId: DeleteSchedule
      x-evidence: observed
      responses:
        '200':
          description: Success, empty body
      x-ui-action: Удаление расписания
      description: Destructive. Observed only in Test zone; app recreated it afterwards.
      parameters:
      - *id002
      - name: scheduleId
        in: query
        required: true
        schema:
          type: string
          format: uuid
