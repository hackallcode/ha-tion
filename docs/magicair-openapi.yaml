      x-evidence: apk-static
      responses:
        '200':
          description: Success, empty body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
  /account/forgot:
    post:
      tags:
      - Account
      summary: Request password reset
      operationId: RequestPasswordReset
      x-evidence: apk-static
      responses:
        '200':
          description: Success, empty body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
      security: []
  /account/move:
    post:
      tags:
      - Account
      summary: Move account
      operationId: MoveAccount
      x-evidence: apk-static
      responses:
        '200':
          description: Success, empty body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
  /account/delete:
    post:
      tags:
      - Account
      summary: Delete account
      operationId: DeleteAccount
      x-evidence: apk-static
      responses:
        '200':
          description: Success, empty body
      description: Destructive. Never invoke during discovery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
  /account/request_confirmation:
    post:
      tags:
      - Account
      summary: Request email confirmation
      operationId: RequestEmailConfirmation
      x-evidence: apk-static
      responses:
        '200':
          description: Success, empty body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
      security: []
  /account/register:
    post:
      tags:
      - Account
      summary: Register account
      operationId: RegisterAccount
      x-evidence: apk-static
      responses:
        '200':
          description: Success, empty body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
      security: []
  /account/upload_photo:
    post:
      tags:
      - Account
      summary: Upload profile photo
      operationId: UploadProfilePhoto
      x-evidence: apk-static
      responses:
        '200':
          description: Success, empty body
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                avatar:
                  type: string
                  format: binary
  /location:
    get:
      tags:
      - Location
      summary: List locations with zones and devices
      operationId: ListLocationsWithZonesAndDevices
      x-evidence: observed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locations'
      x-ui-action: Главный экран и периодическое обновление
    post:
      tags:
      - Location
      summary: Create location
      operationId: CreateLocation
      x-evidence: apk-static
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeForm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
  /location/{locationGuid}:
    get:
      tags:
      - Location
      summary: Get location
      operationId: GetLocation
      x-evidence: observed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
      parameters:
      - &id001
        name: locationGuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
      - Location
      summary: Update location
      operationId: UpdateLocation
      x-evidence: apk-static
      responses:
        '200':
          description: Success, empty body
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
    delete:
      tags:
      - Location
      summary: Delete location
      operationId: DeleteLocation
      x-evidence: apk-static
      responses:
        '200':
          description: Success, empty body
      description: Destructive; static declaration only.
      parameters:
      - *id001
  /location/{locationGuid}/zone:
    post:
      tags:
      - Location
      summary: Create zone
      operationId: CreateZone
      x-evidence: apk-static
      responses:
        '200':
          description: Success
