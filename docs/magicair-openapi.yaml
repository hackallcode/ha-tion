            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
      x-ui-action: Открытие расписания
      parameters:
      - *id002
    post:
      tags:
      - Schedules
      summary: Create schedule
      operationId: CreateSchedule
      x-evidence: observed
      responses:
        '200':
          description: Success, empty body
      x-ui-action: Создание расписания
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
    put:
      tags:
      - Schedules
      summary: Update schedule
      operationId: UpdateSchedule
      x-evidence: observed
      responses:
        '200':
          description: Success, empty body
      x-ui-action: Дни и времена расписания
      parameters:
      - *id002
      - name: scheduleId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
    delete:
      tags:
      - Schedules
