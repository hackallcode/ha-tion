  /location/{locationGuid}/mac/{mac}:
    post:
      tags:
      - Location
      summary: Set base-station MAC
      operationId: SetBaseStationMac
      x-evidence: apk-static
      responses:
        '200':
          description: Success, empty body
      parameters:
      - *id001
      - name: mac
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeForm'
  /location/{locationGuid}/deviceOrder:
    post:
      tags:
      - Location
      summary: Update device order
      operationId: UpdateDeviceOrder
      x-evidence: observed
      responses:
        '200':
          description: Success, empty body
      x-ui-action: Перенос/сортировка устройств
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
